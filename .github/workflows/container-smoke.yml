# Valida exportações, funcionalidades preservadas e a imagem da plataforma KNIGHT/NIST.
name: container-smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'render.yaml'
      - 'global.json'
      - 'backend/**'
      - 'scripts/ci/**'
      - 'frontend/**'
      - '.github/workflows/container-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_BUILDKIT: '1'
      IMAGE: aegis-homolog:ci
      NET: aegis-ci-net
      PG: aegis-ci-pg
      APP: aegis-ci-app
      SECRET_PATH: /etc/secrets/aegis-dataprotection.pfx.b64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install DejaVu fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: PDF export tests on Linux (only PostureSnapshotExportTests)
        run: >
          dotnet test backend/tests/AegisScore.Infrastructure.Tests/AegisScore.Infrastructure.Tests.csproj
          -c Release --filter "FullyQualifiedName~PostureSnapshotExportTests"

      - name: Runner PowerShell version (used by PowerShellFixtureModuleTests below)
        run: pwsh -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'

      - name: KNIGHT, NIST, documents and asset context tests on Linux
        env:
          # PowerShellFixtureModuleTests executa o pwsh REAL do runner: sem ele o teste FALHA (nunca vira verde vazio).
          AEGIS_PWSH_GATE_REQUIRED: 'true'
        run: >
          dotnet test backend/tests/AegisScore.Infrastructure.Tests/AegisScore.Infrastructure.Tests.csproj
          -c Release --filter "FullyQualifiedName~EntraIdentityRiskCollectorTests|FullyQualifiedName~IdentityRiskEvidenceFabricTests|FullyQualifiedName~DocumentIntegrationFactoryTests|FullyQualifiedName~SimulatedDocumentProviderGuardTests|FullyQualifiedName~KnightAffectedObjectTests|FullyQualifiedName~RemediationJourneyTests|FullyQualifiedName~IdentityAcquisitionTests|FullyQualifiedName~IdentityHistoryRetentionTests|FullyQualifiedName~AegisAssessmentServiceTests|FullyQualifiedName~KnightDurableAssessmentTests|FullyQualifiedName~KnightConditionalAccessTests|FullyQualifiedName~KnightMulticloudReportTests|FullyQualifiedName~KnightSyncTests|FullyQualifiedName~KnightEntraCollectorTests|FullyQualifiedName~PostureSnapshotTests|FullyQualifiedName~KnightEntraConfigurationFlowTests|FullyQualifiedName~KnightConfigurationRulesTests|FullyQualifiedName~KnightReferenceCoverageTests|FullyQualifiedName~KnightAccessReviewScopeTests|FullyQualifiedName~EntraGraphDiagnosticsTests|FullyQualifiedName~KnightTeamsCollectorTests|FullyQualifiedName~KnightTeamsPolicyReachTests|FullyQualifiedName~KnightTeamsConfigurationFlowTests|FullyQualifiedName~TeamsAdapterTransportTests|FullyQualifiedName~KnightExchangeConfigurationFlowTests|FullyQualifiedName~ExchangeAdapterTransportTests|FullyQualifiedName~PostureSnapshotConsolidatedTests|FullyQualifiedName~KnightConsolidatedBuilderTests|FullyQualifiedName~KnightIdentityPostureConnectorTests|FullyQualifiedName~KnightM365ServicesFlowTests|FullyQualifiedName~MicrosoftAppCredentialTests|FullyQualifiedName~DnsTxtResolverTests|FullyQualifiedName~KnightAccessProbesM365Tests|FullyQualifiedName~ProtectionRuntimeDiagnosticsTests|FullyQualifiedName~TenantManagementServiceTests|FullyQualifiedName~KnightAzureFlowTests|FullyQualifiedName~KnightPresentationTests|FullyQualifiedName~KnightClosureFlowTests|FullyQualifiedName~KnightReadOnlyAccessTests|FullyQualifiedName~KnightManualResultTests|FullyQualifiedName~NistAssessmentServiceTests|FullyQualifiedName~NistJourneyCompleteTests|FullyQualifiedName~MaturityProfileTests|FullyQualifiedName~PostureMonthlyHistoryTests|FullyQualifiedName~FrozenPostureHistoryTests|FullyQualifiedName~AssessmentVisualsReportTests|FullyQualifiedName~KnightResultsReportTests|FullyQualifiedName~NistAssistServiceTests|FullyQualifiedName~NistAssistReportCompatibilityTests|FullyQualifiedName~AiStatusControllerTests|FullyQualifiedName~StubAssessmentServiceTests|FullyQualifiedName~AuditorPersonaTests|FullyQualifiedName~AuditorReplyCheckTests|FullyQualifiedName~AuditorContextTests|FullyQualifiedName~ProductConnectorScopeTests|FullyQualifiedName~RetiredFeaturesTests|FullyQualifiedName~DocumentEvidenceReconcilerTests|FullyQualifiedName~KnightCollectionReliabilityTests|FullyQualifiedName~KnightRestContractTests|FullyQualifiedName~KnightAzureDiscoveryTests|FullyQualifiedName~KnightIntuneSettingsTests|FullyQualifiedName~KnightEntraGroupMembershipTests|FullyQualifiedName~KnightCaGroupScopeTests|FullyQualifiedName~KnightTeamsFabricAccessTests|FullyQualifiedName~PowerShellAdapterProtocolTests|FullyQualifiedName~PowerShellFixtureModuleTests|FullyQualifiedName~KnightMemoryBudgetTests"

      - name: Build homologation image
        run: docker build -t "$IMAGE" .

      - name: PowerShell adapter scripts on the image's PowerShell runtime (fixture modules, non-root)
        env:
          AEGIS_PWSH_GATE_REQUIRED: 'true'
        run: |
          set -euo pipefail
          # Prova o código e o protocolo do AEGIS (scripts embutidos, quadros, interpretação) com os MESMOS binários do pwsh da
          # imagem; os módulos do fornecedor são substituídos por módulos de FIXTURE. Não prova o módulo oficial (gates abaixo)
          # nem autenticação/autorização em locatário real.
          DEST="$RUNNER_TEMP/image-pwsh"
          rm -rf "$DEST"; mkdir -p "$DEST"
          CID="$(docker create "$IMAGE")"
          docker cp "$CID:/opt/microsoft/powershell/." "$DEST/"
          docker rm "$CID" >/dev/null
          PWSH="$(find "$DEST" -maxdepth 2 -name pwsh -type f | head -n1)"
          test -n "$PWSH" || { echo "pwsh da imagem NAO encontrado"; exit 1; }
          chmod +x "$PWSH"
          echo "usuario efetivo: $(id -u)"; test "$(id -u)" -ne 0 || { echo "este passo deve rodar sem privilegios"; exit 1; }
          echo "pwsh da imagem: $("$PWSH" -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()')"
          AEGIS_TEST_PWSH="$PWSH" dotnet test backend/tests/AegisScore.Infrastructure.Tests/AegisScore.Infrastructure.Tests.csproj \
            -c Release --no-build --filter "FullyQualifiedName~PowerShellFixtureModuleTests" --logger "console;verbosity=normal"

      - name: Exchange large enumeration inside a 512 MiB container (fixture module, real cgroup monitor)
        run: |
          set -euo pipefail
          # [AEGIS-KNIGHT-RUNTIME-DIAGNOSIS] Mesmo limite do serviço no Render (512 MiB, sem swap). Dentro do contêiner rodam o
          # processo de TESTE (no lugar da API: carrega mais assemblies que ela) e o adaptador com o pwsh da imagem; o monitor de
          # pressão e o heap do filho leem o cgroup real. Enumeração do módulo de fixture: 6000 caixas, contas e configurações de
          # acesso, teto 5000. Não prova o consumo da sessão Microsoft real nem a API em produção.
          DEST="$RUNNER_TEMP/image-pwsh"
          PWSH="$(find "$DEST" -maxdepth 2 -name pwsh -type f | head -n1)"
          DLL="$GITHUB_WORKSPACE/backend/tests/AegisScore.Infrastructure.Tests/bin/Release/net10.0/AegisScore.Infrastructure.Tests.dll"
          test -f "$DLL"
          docker run --rm --memory=512m --memory-swap=512m --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e DOTNET_CLI_HOME=/tmp -e DOTNET_NOLOGO=1 -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e AEGIS_PWSH_GATE_REQUIRED=true -e AEGIS_TEST_PWSH="$PWSH" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$DEST:$DEST:ro" -v "$HOME/.nuget:$HOME/.nuget:ro" -w "$GITHUB_WORKSPACE" \
            mcr.microsoft.com/dotnet/sdk:10.0 sh -c '
              echo "memory.max=$(cat /sys/fs/cgroup/memory.max)"
              set +e
              dotnet test "'"$DLL"'" --filter "FullyQualifiedName~Exchange_EnumeracaoGrande|FullyQualifiedName~Exchange_SucessoControlado" \
                --logger "console;verbosity=normal"
              rc=$?
              echo "memory.peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo indisponivel)"
              echo "--- memory.events ---"; cat /sys/fs/cgroup/memory.events 2>/dev/null || echo indisponivel
              exit $rc'

      - name: Teams collection runtime inside the image (real adapter path, non-root, offline)
        run: |
          set -euo pipefail

          echo "--- usuário efetivo da aplicação e executável disponível ---"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'id -u; test -x /usr/bin/pwsh && echo pwsh-executavel'

          echo "--- adaptador de coleta: execução real do script embutido, sem rede e sem locatário ---"
          set +e
          OUT="$(docker run --rm --network none --entrypoint dotnet "$IMAGE" \
            /app/AegisScore.Api.dll --knight-teams-runtime-check 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then echo "runtime do Teams NAO validado (codigo $CODE)"; exit 1; fi
          for MARCA in "module-check=OK" "coleta-sintetica=OK" "adaptador=OK" "processo (module-check): terminação=Completed" "processo (cenário sintético): terminação=Completed"; do
            case "$OUT" in *"$MARCA"*) ;; *) echo "runtime do Teams NAO validado: falta $MARCA"; exit 1;; esac
          done

          case "$OUT" in
            *"AEGIS-MARCADOR-SINTETICO"*)
              echo "runtime do Teams NAO validado: marcador de segredo vazou para a saida"; exit 1;;
          esac

      - name: Exchange Online collection runtime inside the image (real adapter path, non-root, offline)
        run: |
          set -euo pipefail

          echo "--- adaptador do Exchange: execução real do script embutido, sem rede e sem locatário ---"
          set +e
          OUT="$(docker run --rm --network none --entrypoint dotnet "$IMAGE" \
            /app/AegisScore.Api.dll --knight-exchange-runtime-check 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then echo "runtime do Exchange NAO validado (codigo $CODE)"; exit 1; fi
          for MARCA in "module-check=OK" "coleta-sintetica=OK" "adaptador-exchange=OK" "processo (module-check): terminação=Completed" "processo (cenário sintético): terminação=Completed"; do
            case "$OUT" in *"$MARCA"*) ;; *) echo "runtime do Exchange NAO validado: falta $MARCA"; exit 1;; esac
          done

          case "$OUT" in
            *"NÃO verificados aqui"*) ;;
            *) echo "runtime do Exchange NAO validado: falta a ressalva sobre os comandos de sessao"; exit 1;;
          esac

          for RESSALVA in "alcance-do-gate: offline, sem locatário" "NÃO PROVADO:"; do
            case "$OUT" in
              *"$RESSALVA"*) ;;
              *) echo "runtime do Exchange NAO validado: falta a declaracao de alcance ($RESSALVA)"; exit 1;;
            esac
          done

          case "$OUT" in
            *"AEGIS-MARCADOR-SINTETICO"*)
              echo "runtime do Exchange NAO validado: marcador de token vazou para a saida"; exit 1;;
          esac

      - name: Protection (Defender for Office 365 / Purview) collection runtime inside the image (real adapter path, non-root, offline)
        run: |
          set -euo pipefail
          set +e
          OUT="$(docker run --rm --network none --entrypoint dotnet "$IMAGE" \
            /app/AegisScore.Api.dll --knight-protection-runtime-check 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then echo "runtime de protecao NAO validado (codigo $CODE)"; exit 1; fi
          for MARCA in "module-check=OK" "coleta-sintetica=OK" "adaptador-protecao=OK" "alcance-do-gate: offline, sem locatário" "NÃO PROVADO:" "processo (module-check): terminação=Completed" "security-compliance=limitação de plataforma detectada antes da sessão"; do
            case "$OUT" in *"$MARCA"*) ;; *) echo "runtime de protecao NAO validado: falta $MARCA"; exit 1;; esac
          done
          case "$OUT" in
            *"AEGIS-MARCADOR-SINTETICO"*)
              echo "runtime de protecao NAO validado: marcador de token vazou para a saida"; exit 1;;
          esac

      - name: Container smoke (non-root, secret file, migrator -> bootstrap -> API, health, SPA)
        run: |
          set -uo pipefail

          PGPASS="$(openssl rand -hex 16)"
          PFXPASS="$(openssl rand -hex 16)"
          JWTKEY="$(openssl rand -base64 48)"
          ADMINPASS="ci homologacao $(openssl rand -hex 8)"
          ADMIN_EMAIL="admin@ci.example.com"

          docker network create "$NET" || { echo "falha ao criar rede"; exit 1; }
          docker run -d --name "$PG" --network "$NET" \
            -e POSTGRES_PASSWORD="$PGPASS" -e POSTGRES_DB=aegis_ci postgres:18 \
            || { echo "falha ao subir postgres"; exit 1; }

          echo "== aguardando Postgres"
          pg_ok=0
          for i in $(seq 1 60); do
            if docker exec "$PG" pg_isready -U postgres -d aegis_ci >/dev/null 2>&1; then pg_ok=1; echo "pg pronto em ${i}s"; break; fi
            sleep 1
          done
          [ "$pg_ok" = "1" ] || { echo "postgres nao ficou pronto"; exit 1; }

          mkdir -p secrets
          openssl req -x509 -newkey rsa:2048 -keyout secrets/key.pem -out secrets/cert.pem \
            -days 2 -nodes -subj "/CN=aegis-ci" >/dev/null 2>&1 || { echo "falha ao gerar cert"; exit 1; }
          openssl pkcs12 -export -out secrets/aegis-dp.pfx -inkey secrets/key.pem -in secrets/cert.pem \
            -passout pass:"$PFXPASS" || { echo "falha ao empacotar pkcs12"; exit 1; }
          base64 secrets/aegis-dp.pfx > secrets/aegis-dp.pfx.b64 || { echo "falha ao codificar base64"; exit 1; }
          sudo chown root:1000 secrets/aegis-dp.pfx.b64
          sudo chmod 0640 secrets/aegis-dp.pfx.b64
          echo "== permissoes do secret file .b64 (esperado root 1000 -rw-r-----):"
          ls -l secrets/aegis-dp.pfx.b64

          docker run -d --name "$APP" --network "$NET" -p 8080:8080 \
            -e "ConnectionStrings__AegisScore=Host=$PG;Port=5432;Database=aegis_ci;Username=postgres;Password=$PGPASS;SSL Mode=Disable" \
            -e "Jwt__SigningKey=$JWTKEY" \
            -e "DataProtection__Certificate__Path=$SECRET_PATH" \
            -e "DataProtection__Certificate__Password=$PFXPASS" \
            -e "Bootstrap__Enabled=true" \
            -e "Bootstrap__AdminEmail=$ADMIN_EMAIL" \
            -e "Bootstrap__AdminPassword=$ADMINPASS" \
            -e "Bootstrap__TenantName=Cliente CI" \
            -e "PORT=8080" \
            -v "$PWD/secrets/aegis-dp.pfx.b64:$SECRET_PATH:ro" \
            "$IMAGE" || { echo "falha ao subir a app"; exit 1; }

          HDR='X-Forwarded-Proto: https'   # simula o proxy TLS da hospedagem (evita o redirect HTTPS)
          ready=0
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$APP" 2>/dev/null)" != "true" ]; then echo "container encerrou cedo"; break; fi
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "$HDR" http://localhost:8080/health/ready 2>/dev/null || true)"
            if [ "$code" = "200" ]; then ready=1; echo "ready em ~$((i*2))s"; break; fi
            sleep 2
          done

          fail=0
          gate() { if [ "$2" = "1" ]; then echo "[PASS] $1"; else echo "[FAIL] $1 ${3:-}"; fail=1; fi; }

          gate "/health/ready responde 200" "$ready"

          uidv="$(docker exec "$APP" id -u 2>/dev/null || echo -1)"
          gate "container NAO roda como root" "$([ "$uidv" != "0" ] && [ "$uidv" != "-1" ] && echo 1 || echo 0)" "uid=$uidv"

          gids="$(docker exec "$APP" id -G 2>/dev/null || echo '')"
          gate "processo tem grupo suplementar 1000" "$(echo " $gids " | grep -q ' 1000 ' && echo 1 || echo 0)" "groups=$gids"

          if docker exec "$APP" sh -c "test -r $SECRET_PATH" 2>/dev/null; then rd=1; else rd=0; fi
          gate "app (nao-root) LE o Secret File .b64 montado" "$rd"

          logs="$(docker logs "$APP" 2>&1)"
          echo "$logs" | grep -q "Banco pronto para a API" && m=1 || m=0
          gate "migrator concluiu (verificacao aprovada) antes da API" "$m"
          echo "$logs" | grep -q "Bootstrap conclu" && b=1 || b=0
          gate "bootstrap criou o primeiro acesso" "$b"

          cnt="$(docker exec "$PG" psql -U postgres -d aegis_ci -tAc 'SELECT count(*) FROM "IdentityAccounts" WHERE "PlatformRole"=1' 2>/dev/null | tr -d '[:space:]')"
          gate "1 PlatformAdmin persistido no banco" "$([ "$cnt" = "1" ] && echo 1 || echo 0)" "count=$cnt"

          codeL="$(curl -s -o /dev/null -w '%{http_code}' -H "$HDR" http://localhost:8080/health/live 2>/dev/null || true)"
          gate "/health/live responde 200" "$([ "$codeL" = "200" ] && echo 1 || echo 0)" "code=$codeL"

          root="$(curl -s -H "$HDR" http://localhost:8080/ 2>/dev/null || true)"
          echo "$root" | grep -qE 'app-root|<base href' && rs=1 || rs=0
          gate "/ entrega o shell do Angular" "$rs"

          codeH="$(curl -s -o /dev/null -w '%{http_code}' -H "$HDR" http://localhost:8080/history 2>/dev/null || true)"
          hist="$(curl -s -H "$HDR" http://localhost:8080/history 2>/dev/null || true)"
          { [ "$codeH" = "200" ] && echo "$hist" | grep -qE 'app-root|<base href'; } && hs=1 || hs=0
          gate "/history entrega o SPA (fallback, nao 404)" "$hs" "code=$codeH"

          # [AEGIS-SPA-DEEPLINK-01] Abertura direta/recarga da subcategoria NIST: o ponto do codigo nao pode
          # tirar a URL do fallback (antes: 401). GET e HEAD entregam o shell; o resto segue protegido.
          for SUB in "/nist/rc/RC.RP-06" "/nist/rc/RC.CO-03" "/nist/gv/GV.OC-01" "/nist/id/ID.AM-01"                      "/nist/pr/PR.AA-05" "/nist/de/DE.CM-01" "/nist/rs/RS.MA-02" "/nist/rc/RC.RP-06?rodada=2&escopo=tenant"; do
            codeS="$(curl -s -o /tmp/sub.html -w '%{http_code} %{content_type}' -H "$HDR" "http://localhost:8080$SUB" 2>/dev/null || true)"
            { case "$codeS" in "200 text/html"*) true;; *) false;; esac && grep -qE 'app-root|<base href' /tmp/sub.html; } && ss=1 || ss=0
            gate "GET $SUB entrega o shell do Angular" "$ss" "resp=$codeS"
            codeHd="$(curl -s -I -o /dev/null -w '%{http_code}' -H "$HDR" "http://localhost:8080$SUB" 2>/dev/null || true)"
            gate "HEAD $SUB responde 200" "$([ "$codeHd" = "200" ] && echo 1 || echo 0)" "code=$codeHd"
          done
          for NEG in "/api/v1/knight/assessments/latest" "/api/v1/nist/rc/RC.RP-06" "/nist/xx/RC.RP-06" "/nist/rc/RC.RP-06.js" "/nao-existe.js"; do
            codeN="$(curl -s -o /dev/null -w '%{http_code}' -H "$HDR" "http://localhost:8080$NEG" 2>/dev/null || true)"
            gate "$NEG segue protegido (401, nao vira shell)" "$([ "$codeN" = "401" ] && echo 1 || echo 0)" "code=$codeN"
          done

          run="$(docker inspect -f '{{.State.Running}}' "$APP" 2>/dev/null || echo false)"
          gate "container permanece saudavel durante o smoke" "$([ "$run" = "true" ] && echo 1 || echo 0)" "running=$run"

          echo "-----"
          if [ "$fail" != "0" ]; then echo "SMOKE DO CONTAINER FALHOU"; exit 1; fi
          echo "SMOKE DO CONTAINER OK"

      - name: Logs and cleanup
        if: always()
        run: |
          echo "== logs da app (tail) =="; docker logs "$APP" 2>&1 | tail -120 || true
          echo "== logs do postgres (tail) =="; docker logs "$PG" 2>&1 | tail -30 || true
          docker rm -f "$APP" "$PG" >/dev/null 2>&1 || true
          docker network rm "$NET" >/dev/null 2>&1 || true
          rm -rf secrets || true

  # [AEGIS-KNIGHT-MEMORY-BUDGET] API real aquecida + módulos OFICIAIS da imagem no mesmo contêiner de 512 MiB. Fixture ou processo de teste
  # sozinhos não equivalem a este cenário: foi o que deixou o monitor encerrar toda coleta na importação sem nenhum gate acusar.
  knight-memory-combined:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKER_BUILDKIT: '1'
      IMAGE: aegis-homolog:ci
    steps:
      - uses: actions/checkout@v4

      - name: Build homologation image
        run: docker build -t "$IMAGE" .

      - name: Combined scenario - 512 MiB, same CPU as the Render starter plan (0.5)
        env:
          FIXTURES: ${{ github.workspace }}/backend/tests/AegisScore.Infrastructure.Tests/Knight/Fixtures/psmodules
        run: bash scripts/ci/knight-memory-combined.sh 0.5

      - name: Combined scenario - 512 MiB, without CPU limit (GC sees every core)
        if: always()
        env:
          FIXTURES: ${{ github.workspace }}/backend/tests/AegisScore.Infrastructure.Tests/Knight/Fixtures/psmodules
        run: bash scripts/ci/knight-memory-combined.sh none

      - name: PSI scenario - empty file
        if: always()
        continue-on-error: true
        env:
          FIXTURES: ${{ github.workspace }}/backend/tests/AegisScore.Infrastructure.Tests/Knight/Fixtures/psmodules
          PSI_INJECT: vazio
        run: bash scripts/ci/knight-memory-combined.sh 0.5

      - name: PSI scenario - unreadable file
        if: always()
        continue-on-error: true
        env:
          FIXTURES: ${{ github.workspace }}/backend/tests/AegisScore.Infrastructure.Tests/Knight/Fixtures/psmodules
          PSI_INJECT: ilegivel
        run: bash scripts/ci/knight-memory-combined.sh 0.5

      - name: PSI scenario - invalid value
        if: always()
        continue-on-error: true
        env:
          FIXTURES: ${{ github.workspace }}/backend/tests/AegisScore.Infrastructure.Tests/Knight/Fixtures/psmodules
          PSI_INJECT: invalido
        run: bash scripts/ci/knight-memory-combined.sh 0.5

      - name: Real memory load scenario - valid PSI
        if: always()
        continue-on-error: true
        env:
          FIXTURES: ${{ github.workspace }}/backend/tests/AegisScore.Infrastructure.Tests/Knight/Fixtures/psmodules
          CARGA_EXTERNA: '1'
        run: bash scripts/ci/knight-memory-combined.sh 0.5

      - name: Real memory load scenario - no PSI
        if: always()
        continue-on-error: true
        env:
          FIXTURES: ${{ github.workspace }}/backend/tests/AegisScore.Infrastructure.Tests/Knight/Fixtures/psmodules
          PSI_INJECT: vazio
          CARGA_EXTERNA: '1'
        run: bash scripts/ci/knight-memory-combined.sh 0.5

  migrations-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Migration/posture PostgreSQL 18 tests
        env:
          AEGIS_TEST_PG: 'Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres;Pooling=false'
          AEGIS_PG_GATE_REQUIRED: 'true'
        run: >
          dotnet test backend/tests/AegisScore.Infrastructure.Tests/AegisScore.Infrastructure.Tests.csproj
          -c Release --filter "FullyQualifiedName~DocumentEvidenceRepairMigrationTests|FullyQualifiedName~PostureFoundationPostgresTests|FullyQualifiedName~IdentityEvidencePostgresTests|FullyQualifiedName~KnightAffectedObjectsPostgresTests|FullyQualifiedName~RemediationPostgresTests|FullyQualifiedName~RemediationJourneyHttpTests|FullyQualifiedName~DatabaseUpgradePostgresTests|FullyQualifiedName~IdentityAcquisitionPostgresTests|FullyQualifiedName~IdentityHistoryRetentionPostgresTests|FullyQualifiedName~KnightDurableAssessmentPostgresTests|FullyQualifiedName~KnightLatestHttpTests|FullyQualifiedName~KnightUnfinishedRunPlanHttpTests|FullyQualifiedName~KnightMulticloudPostgresTests|FullyQualifiedName~KnightSyncHttpTests|FullyQualifiedName~KnightEntraConfigurationPostgresTests|FullyQualifiedName~KnightTeamsConfigurationPostgresTests|FullyQualifiedName~KnightExchangeConfigurationPostgresTests|FullyQualifiedName~KnightPersistenceReasonPostgresTests|FullyQualifiedName~KnightM365ServicesPostgresTests|FullyQualifiedName~KnightAzurePostgresTests|FullyQualifiedName~KnightCollectionGapsPostgresTests|FullyQualifiedName~KnightManualResultPostgresTests|FullyQualifiedName~KnightManualResultHttpTests|FullyQualifiedName~NistJourneyPostgresTests|FullyQualifiedName~NistJourney02PostgresTests|FullyQualifiedName~NistJourneyHttpTests|FullyQualifiedName~AssessmentVisualsPostgresTests|FullyQualifiedName~NistAssistPostgresTests|FullyQualifiedName~NistAssistHttpTests|FullyQualifiedName~AuditorHttpTests|FullyQualifiedName~SpaDeepLinkHttpTests"

  # [AEGIS-NIST-GUIDES-01] Bateria de lógica do frontend (npm run test:logic). O build Angular da imagem não a executa.
  # Checkout completo: o spec dos roteiros NIST confere os 106 resultados oficiais com o catálogo do backend.
  frontend-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend logic tests
        run: npm run test:logic
