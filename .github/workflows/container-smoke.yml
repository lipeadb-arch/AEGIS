# [Homologação] Valida a imagem ÚNICA de homologação em Linux real (o que não pôde rodar localmente por
# ausência de Docker): PDF/acentos no Linux, testes DIRECIONADOS dos conectores SIEM (Google SecOps/Chronicle
# + Microsoft Sentinel, HTTP simulado), build da imagem do Dockerfile atual e um smoke do container
# (não-root + grupo 1000 + secret file, migrator -> bootstrap -> API, health e SPA). NÃO é uma suíte geral.
name: container-smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'render.yaml'
      - 'global.json'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/container-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_BUILDKIT: '1'
      IMAGE: aegis-homolog:ci
      NET: aegis-ci-net
      PG: aegis-ci-pg
      APP: aegis-ci-app
      SECRET_PATH: /etc/secrets/aegis-dataprotection.pfx.b64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 1) PDF no Linux: instala DejaVu e roda SÓ os testes de exportação (geração + acentos).
      - name: Install DejaVu fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: PDF export tests on Linux (only PostureSnapshotExportTests)
        run: >
          dotnet test backend/tests/AegisScore.Infrastructure.Tests/AegisScore.Infrastructure.Tests.csproj
          -c Release --filter "FullyQualifiedName~PostureSnapshotExportTests"

      # 1b) Testes DIRECIONADOS dos conectores SIEM em Linux real — HTTP SIMULADO (sem credenciais Google, sem API
      #     viva, sem PostgreSQL). Prova em Linux: contrato HTTP oficial do Chronicle (instances.get, cases.list v1,
      #     legacySearchEnterpriseWideAlerts), autenticação Google (service account, sem DWD), allowlist e segurança
      #     do bearer, agregação/parcialidade, ZERO sinais de score, registro na DI e a regressão do Microsoft
      #     Sentinel. [AEGIS-MVP-GOOGLE-SECOPS-02] Inclui a COBERTURA DE DETECÇÃO: transporte rules.list CONFIG_ONLY
      #     (ChronicleRulesApiTests), agregação regras×MITRE (DetectionCoverageCollectorTests), catálogo MITRE v17.1
      #     real (MitreAttackCatalogTests) e a reconciliação/leitura + GARANTIA de zero score (DetectionCoveragePersistenceTests,
      #     SQLite). [AEGIS-MVP-MICROSOFT-COVERAGE-02] Inclui o Microsoft Intune: transporte/coletor por HTTP simulado
      #     sobre o Graph v1.0 (IntuneDevicePostureCollectorTests), reconciliação por DIMENSÃO + leitura honesta
      #     (DevicePosturePersistenceTests, SQLite) e a garantia de ZERO EvidenceSignal/TenantControlState pela cadeia
      #     completa do executor (ScoreGuardDevicePostureTests). [AEGIS-MVP-MICROSOFT-COVERAGE-03] Inclui o RISCO
      #     DE IDENTIDADE do Entra: transporte/semântica/parcialidade/privacidade por HTTP simulado sobre o Graph
      #     v1.0 (EntraIdentityRiskCollectorTests) e o schema v2 da Evidence Fabric, a compatibilidade com o v1 e
      #     as GUARDAS de score/NIST (IdentityRiskEvidenceFabricTests, SQLite).
      # ⚠️ Filtro POR CLASSE, igual ao de migrations-pg, e NENHUM job roda a suíte backend inteira: uma classe de
      #     teste NOVA que não seja adicionada aqui simplesmente não executa e o check fica verde assim mesmo
      #     (falso verde). Confira SEMPRE a CONTAGEM no log, não só conclusion=success.
      #     [AEGIS-MVP-PRODUCT-01] Inclui a tela inicial e a honestidade documental: a COMPOSIÇÃO por dimensão
      #     independente da Visão geral (DashboardOverviewQueryTests, SQLite — ambiente observado NÃO some por
      #     falta de maturidade legada, e ausência de coleta é null, nunca zero) e o gate do provedor documental
      #     SIMULADO (DocumentIntegrationFactoryTests + SimulatedDocumentProviderGuardTests). A revisão do Codex
      #     acrescentou a distinção de INVENTÁRIO a DashboardOverviewQueryTests (inventário vazio não prova
      #     ausência de coleta): a classe já consta no filtro, então os 2 casos novos executam aqui de fato — a
      #     contagem deste passo sobe de 286 para 288.
      #     [AEGIS-MVP-PRODUCT-03] Entra RemediationJourneyTests (SQLite): a JORNADA de remediação — duplicação
      #     por clique repetido e reabertura de ciclo, transições do fluxo mínimo, atraso derivado do PRAZO,
      #     origem × validação como referências separadas, evidência que NÃO comprova correção (ordem temporal,
      #     fonte, regras e suficiência POR INDICADOR), publicação da avaliação PEDIDA sem troca pela mais
      #     recente, congelamento das ações no snapshot, isolamento por tenant, autorização das mutações por
      #     reflexão, compatibilidade do plano legado de risco e do hash de snapshot legado, e a serialização
      #     efetiva dos contratos novos com as opções REAIS do MVC. A correção dirigida acrescentou a BASE do
      #     encerramento (execução relatada + validação aplicável AO CICLO), a reabertura que repactua o ciclo
      #     sem reaproveitar comprovação antiga, a ressalva de CAUSALIDADE quando a coleta antecede o relato de
      #     execução, a separação por fonte/modo (demonstração × coleta real sob o mesmo indicador), o relatório
      #     real que exclui ação de demonstração e a proveniência congelada impressa no PDF. A segunda correção
      #     acrescentou a APLICABILIDADE AO CICLO congelada na fotografia: uma ação reaberta sem comprovação
      #     nova sai do total de melhora comprovada e é identificada como registro histórico, a coleta anterior
      #     ao relato permanece como observação fora daquela comprovação, a validação do ciclo em curso continua
      #     contando, e uma fotografia ANTERIOR à distinção não recebe aplicabilidade inventada. A classe é
      #     NOVA: sem esta linha ela não executaria e o check ficaria verde do mesmo jeito. A contagem deste
      #     passo sobe de 307 para 353 (medida localmente com este MESMO filtro).
      #     [AEGIS-MVP-PRODUCT-02] Entra KnightAffectedObjectTests (SQLite): os OBJETOS que sustentam um achado
      #     do KNIGHT — contagem × lista na mesma unidade e dedupe, avaliação anterior à preservação que se
      #     declara sem detalhe (nunca retropreenchida), campo ausente que permanece ausente, coleta parcial
      #     declarada, isolamento por tenant e paginação/busca no servidor. Sem esta linha a classe NÃO roda e
      #     o check ficaria verde do mesmo jeito. A contagem deste passo sobe de 288 para 301.
      #     [AEGIS-ADM-01] Entra IdentityAcquisitionTests (SQLite): o ADM por identidade no caminho REAL de
      #     aquisição e consumo — mesma conta em dois conjuntos com UMA entidade e DUAS observações de
      #     conteúdo PRÓPRIO (e independentes da ordem em que a coleta devolve os conjuntos), renomeação que
      #     preserva a identidade sem reescrever a evidência, homônimos e namespaces distintos que não se
      #     unificam, convidado B2B que não funde por e-mail, retry idempotente × coleta nova com o mesmo
      #     conteúdo, reapresentação INCOMPATÍVEL recusada sem alteração parcial, conjunto não coletado que
      #     continua desconhecido, falha que preserva a última evidência válida, coleta atrasada que não
      #     regride entidade/vínculo/snapshot/saúde do conector, parcialidade atrasada que não rebaixa o
      #     último dado válido, empate temporal determinístico, avaliação
      #     lendo a aquisição persistida com UMA coleta, Demo fora do ADM, envelopes v1/v2 legíveis e
      #     tradução de tipos total. A classe é NOVA: sem esta linha ela não executaria e o check ficaria
      #     verde do mesmo jeito. A contagem deste passo sobe de 353 para 374 (medida localmente com este
      #     MESMO filtro, em Release).
      #     [AEGIS-ADM-02] Entra IdentityHistoryRetentionTests (SQLite): o histórico MENSAL e a retenção
      #     operacional do ADM — fotografia do mês × última tentativa em separado; "sem coleta" × "coletou e
      #     não achou ninguém" × "detalhe expirado por retenção"; parcial que permanece parcial; corte dos 90
      #     dias EXATO no instante e virada de mês em UTC; reconsolidação idempotente ANTES e DEPOIS do
      #     expurgo, com contagens conservadas (sobreviventes + removidas) e coleta atrasada mais recente
      #     assumindo o mês mesmo sozinha contra três; empate de instante desempatado por identificador;
      #     remoção recusada sem consolidação na mesma passada (no serviço E na configuração); referência do
      #     cadastro atual (entidade canônica / vínculo de origem) impedindo remoção integral sem impedir o
      #     expurgo do detalhe; replay recusado tanto por detalhe expirado quanto por remoção INTEGRAL, pela
      #     fronteira gravada no mês; origem com falha isolada das demais; cancelamento gracioso; retomada por
      #     cursor visitando cada origem uma única vez; lote de aquisições drenado em passadas sucessivas;
      #     simulação que não escreve; origem sem nenhuma aquisição que continua varrida e só expira o que
      #     passou dos 12 meses (sem se reconstruir com doze meses vazios); isolamento por tenant e leitura
      #     que não dispara expurgo. A classe é
      #     NOVA: sem esta linha ela não executaria e o check ficaria verde do mesmo jeito. A contagem deste
      #     passo sobe de 374 para 400 (medida localmente com este MESMO filtro, em Release).
      #     As três correções dirigidas finais acrescentaram 4 casos NAS CLASSES QUE JÁ CONSTAM DESTE FILTRO
      #     (nenhuma classe nova): exclusão do conector que não encolhe o mês e reconexão que incorpora a
      #     coleta nova uma única vez; disponibilidade do detalhe apurada NA FOTOGRAFIA (detalhe expurgado ×
      #     remoção integral × ausência por exclusão da origem × fotografia íntegra em mês com expurgo);
      #     replay recusado pela janela de ADMISSÃO depois de a consolidação do mês expirar, sem repovoar
      #     projeção alguma; e os limites exatos dessa janela, com a coleta atrasada de dentro dela aceita.
      #     A contagem deste passo sobe de 400 para 404 (medida localmente com este MESMO filtro, em Release).
      #     A correção da CAUSA da remoção da fotografia acrescentou 1 caso na mesma classe (troca de
      #     fotografia que não herda o comprovante de remoção da anterior): 404 para 405.
      #     [AEGIS-LANGUAGE-STATES-01] Estados de informação e linguagem. DashboardOverviewQueryTests (JÁ no filtro)
      #     ganhou 3 casos — sem fonte × fonte sem coleta × primeira tentativa falha, última leitura preservada com
      #     ressalva após falha recente, e zero de coleta parcial com ressalva de escopo: 405 para 408. Entram TRÊS
      #     classes que já existiam e NUNCA rodavam no CI, porque o pacote as alterou: PostureExposureReconcilerTests
      #     (estado da fonte no resumo e SourceReadings do contexto da IA), AegisAssessmentServiceTests (escalas
      #     distintas e estado das fontes no prompt) e GenerateAdvisoryHandlerTests (canned de PR.AA-01 ancorado no
      #     controle inteiro). Sem estas linhas elas não executariam e o check ficaria verde do mesmo jeito. A
      #     contagem deste passo sobe de 408 para 437 (medida localmente com este MESMO filtro, em Release).
      #     [AEGIS-ENTITY-RESOLUTION-01] Resolução de dispositivos entre fontes por vínculo forte. Entra a classe NOVA
      #     DeviceResolutionTests (SQLite): conectores REAIS do Defender e do Intune sobre HTTP sintético → executor →
      #     autoridade única de resolução → persistência → leitura (query + controller) — mesmo diretório/identificador
      #     nas duas fontes = um ativo e dois bindings, as duas ordens e a reexecução com o identificador canônico
      #     preservado, diretórios/tenants diferentes e hostname igual sem união, identificador ausente/vazio/inválido/
      #     placeholder sem união (e sem invalidar a máquina), diretório não confirmado, identificador informado depois,
      #     contradição que não move o binding, duplicidade legada preservada como conflito, atributos curados
      #     preservados, falha/parcial/desaparecimento em uma só fonte, fatos da fonte sem score e identificadores só no
      #     diagnóstico do administrador. Entram também TRÊS classes que já existiam e nunca rodavam no CI, porque o
      #     pacote alterou o código delas: VulnerabilityReconcilerTests e SoftwareInventoryReconcilerTests (o
      #     reconciliador passou a delegar ativos/bindings à autoridade única) e MicrosoftDefenderVulnerabilityConnectorTests
      #     (o parser de máquinas passou a ler aadDeviceId). A contagem deste passo sobe de 439 para 528 (26 da classe
      #     nova + 63 das três existentes; medida localmente com este MESMO filtro, em Release).
      - name: Dashboard, SIEM, device management and identity connector tests on Linux
        run: >
          dotnet test backend/tests/AegisScore.Infrastructure.Tests/AegisScore.Infrastructure.Tests.csproj
          -c Release --filter "FullyQualifiedName~ChronicleApiClientTests|FullyQualifiedName~GoogleSecOpsConnectorTests|FullyQualifiedName~GoogleSecOpsAuthenticatorTests|FullyQualifiedName~GoogleSecOpsDiTests|FullyQualifiedName~LogAnalyticsClientTests|FullyQualifiedName~MicrosoftSentinelConnectorTests|FullyQualifiedName~SentinelPullTests|FullyQualifiedName~ChronicleRulesApiTests|FullyQualifiedName~DetectionCoverageCollectorTests|FullyQualifiedName~MitreAttackCatalogTests|FullyQualifiedName~DetectionCoveragePersistenceTests|FullyQualifiedName~IntuneDevicePostureCollectorTests|FullyQualifiedName~DevicePosturePersistenceTests|FullyQualifiedName~ScoreGuardDevicePostureTests|FullyQualifiedName~EntraIdentityRiskCollectorTests|FullyQualifiedName~IdentityRiskEvidenceFabricTests|FullyQualifiedName~DashboardOverviewQueryTests|FullyQualifiedName~DocumentIntegrationFactoryTests|FullyQualifiedName~SimulatedDocumentProviderGuardTests|FullyQualifiedName~KnightAffectedObjectTests|FullyQualifiedName~RemediationJourneyTests|FullyQualifiedName~IdentityAcquisitionTests|FullyQualifiedName~IdentityHistoryRetentionTests|FullyQualifiedName~PostureExposureReconcilerTests|FullyQualifiedName~AegisAssessmentServiceTests|FullyQualifiedName~GenerateAdvisoryHandlerTests|FullyQualifiedName~DeviceResolutionTests|FullyQualifiedName~VulnerabilityReconcilerTests|FullyQualifiedName~SoftwareInventoryReconcilerTests|FullyQualifiedName~MicrosoftDefenderVulnerabilityConnectorTests"

      # 2) Build da imagem REAL (Dockerfile atual, até o runtime final).
      - name: Build homologation image
        run: docker build -t "$IMAGE" .

      # 3) Smoke do container: rede + Postgres descartáveis, PKCS#12 sintético (grupo 1000, 0640),
      #    montado em /etc/secrets, app com valores 100% sintéticos. TLS interno desabilitado só aqui.
      - name: Container smoke (non-root, secret file, migrator -> bootstrap -> API, health, SPA)
        run: |
          set -uo pipefail

          # --- valores SINTÉTICOS (nunca impressos) ---
          PGPASS="$(openssl rand -hex 16)"
          PFXPASS="$(openssl rand -hex 16)"
          JWTKEY="$(openssl rand -base64 48)"
          ADMINPASS="ci homologacao $(openssl rand -hex 8)"
          ADMIN_EMAIL="admin@ci.example.com"

          # --- rede + Postgres descartável ---
          docker network create "$NET" || { echo "falha ao criar rede"; exit 1; }
          docker run -d --name "$PG" --network "$NET" \
            -e POSTGRES_PASSWORD="$PGPASS" -e POSTGRES_DB=aegis_ci postgres:18 \
            || { echo "falha ao subir postgres"; exit 1; }

          echo "== aguardando Postgres"
          pg_ok=0
          for i in $(seq 1 60); do
            if docker exec "$PG" pg_isready -U postgres -d aegis_ci >/dev/null 2>&1; then pg_ok=1; echo "pg pronto em ${i}s"; break; fi
            sleep 1
          done
          [ "$pg_ok" = "1" ] || { echo "postgres nao ficou pronto"; exit 1; }

          # --- PKCS#12 sintético -> BASE64 textual (o Render so aceita Secret Files como TEXTO) ---
          mkdir -p secrets
          openssl req -x509 -newkey rsa:2048 -keyout secrets/key.pem -out secrets/cert.pem \
            -days 2 -nodes -subj "/CN=aegis-ci" >/dev/null 2>&1 || { echo "falha ao gerar cert"; exit 1; }
          openssl pkcs12 -export -out secrets/aegis-dp.pfx -inkey secrets/key.pem -in secrets/cert.pem \
            -passout pass:"$PFXPASS" || { echo "falha ao empacotar pkcs12"; exit 1; }
          # Base64 do PKCS#12 (com as quebras de linha do wrap, como um Secret File real) — prova o caminho .b64.
          base64 secrets/aegis-dp.pfx > secrets/aegis-dp.pfx.b64 || { echo "falha ao codificar base64"; exit 1; }
          # Secret File TEXTUAL com dono root, grupo 1000, 0640 (equivalente ao secret file do Render).
          sudo chown root:1000 secrets/aegis-dp.pfx.b64
          sudo chmod 0640 secrets/aegis-dp.pfx.b64
          echo "== permissoes do secret file .b64 (esperado root 1000 -rw-r-----):"
          ls -l secrets/aegis-dp.pfx.b64

          # --- sobe a imagem com valores sintéticos; TLS interno DESABILITADO só nesta conexao descartavel ---
          docker run -d --name "$APP" --network "$NET" -p 8080:8080 \
            -e "ConnectionStrings__AegisScore=Host=$PG;Port=5432;Database=aegis_ci;Username=postgres;Password=$PGPASS;SSL Mode=Disable" \
            -e "Jwt__SigningKey=$JWTKEY" \
            -e "DataProtection__Certificate__Path=$SECRET_PATH" \
            -e "DataProtection__Certificate__Password=$PFXPASS" \
            -e "Bootstrap__Enabled=true" \
            -e "Bootstrap__AdminEmail=$ADMIN_EMAIL" \
            -e "Bootstrap__AdminPassword=$ADMINPASS" \
            -e "Bootstrap__TenantName=Cliente CI" \
            -e "PORT=8080" \
            -v "$PWD/secrets/aegis-dp.pfx.b64:$SECRET_PATH:ro" \
            "$IMAGE" || { echo "falha ao subir a app"; exit 1; }

          # --- aguarda readiness (migrator roda ANTES da API) ---
          HDR='X-Forwarded-Proto: https'   # simula o proxy TLS da hospedagem (evita o redirect HTTPS)
          ready=0
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$APP" 2>/dev/null)" != "true" ]; then echo "container encerrou cedo"; break; fi
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "$HDR" http://localhost:8080/health/ready 2>/dev/null || true)"
            if [ "$code" = "200" ]; then ready=1; echo "ready em ~$((i*2))s"; break; fi
            sleep 2
          done

          # --- gates ---
          fail=0
          gate() { if [ "$2" = "1" ]; then echo "[PASS] $1"; else echo "[FAIL] $1 ${3:-}"; fail=1; fi; }

          gate "/health/ready responde 200" "$ready"

          uidv="$(docker exec "$APP" id -u 2>/dev/null || echo -1)"
          gate "container NAO roda como root" "$([ "$uidv" != "0" ] && [ "$uidv" != "-1" ] && echo 1 || echo 0)" "uid=$uidv"

          gids="$(docker exec "$APP" id -G 2>/dev/null || echo '')"
          gate "processo tem grupo suplementar 1000" "$(echo " $gids " | grep -q ' 1000 ' && echo 1 || echo 0)" "groups=$gids"

          if docker exec "$APP" sh -c "test -r $SECRET_PATH" 2>/dev/null; then rd=1; else rd=0; fi
          gate "app (nao-root) LE o Secret File .b64 montado" "$rd"

          logs="$(docker logs "$APP" 2>&1)"
          echo "$logs" | grep -q "Banco pronto para a API" && m=1 || m=0
          gate "migrator concluiu (verificacao aprovada) antes da API" "$m"
          echo "$logs" | grep -q "Bootstrap conclu" && b=1 || b=0
          gate "bootstrap criou o primeiro acesso" "$b"

          cnt="$(docker exec "$PG" psql -U postgres -d aegis_ci -tAc 'SELECT count(*) FROM "IdentityAccounts" WHERE "PlatformRole"=1' 2>/dev/null | tr -d '[:space:]')"
          gate "1 PlatformAdmin persistido no banco" "$([ "$cnt" = "1" ] && echo 1 || echo 0)" "count=$cnt"

          codeL="$(curl -s -o /dev/null -w '%{http_code}' -H "$HDR" http://localhost:8080/health/live 2>/dev/null || true)"
          gate "/health/live responde 200" "$([ "$codeL" = "200" ] && echo 1 || echo 0)" "code=$codeL"

          root="$(curl -s -H "$HDR" http://localhost:8080/ 2>/dev/null || true)"
          echo "$root" | grep -qE 'app-root|<base href' && rs=1 || rs=0
          gate "/ entrega o shell do Angular" "$rs"

          codeH="$(curl -s -o /dev/null -w '%{http_code}' -H "$HDR" http://localhost:8080/history 2>/dev/null || true)"
          hist="$(curl -s -H "$HDR" http://localhost:8080/history 2>/dev/null || true)"
          { [ "$codeH" = "200" ] && echo "$hist" | grep -qE 'app-root|<base href'; } && hs=1 || hs=0
          gate "/history entrega o SPA (fallback, nao 404)" "$hs" "code=$codeH"

          run="$(docker inspect -f '{{.State.Running}}' "$APP" 2>/dev/null || echo false)"
          gate "container permanece saudavel durante o smoke" "$([ "$run" = "true" ] && echo 1 || echo 0)" "running=$run"

          echo "-----"
          if [ "$fail" != "0" ]; then echo "SMOKE DO CONTAINER FALHOU"; exit 1; fi
          echo "SMOKE DO CONTAINER OK"

      # Coleta logs úteis e remove containers/rede/arquivos temporários — sempre.
      - name: Logs and cleanup
        if: always()
        run: |
          echo "== logs da app (tail) =="; docker logs "$APP" 2>&1 | tail -120 || true
          echo "== logs do postgres (tail) =="; docker logs "$PG" 2>&1 | tail -30 || true
          docker rm -f "$APP" "$PG" >/dev/null 2>&1 || true
          docker network rm "$NET" >/dev/null 2>&1 || true
          rm -rf secrets || true

  # Migrations + seed contra um PostgreSQL 18 DESCARTÁVEL (o container-smoke prova migração em banco VAZIO;
  # estes provam transições/reparo/índices sobre dados). Roda SOMENTE as classes de migration em PostgreSQL:
  #   • DocumentEvidenceRepairMigrationTests — reparo da DocumentEvidenceLifecycle sobre banco legado;
  #   • PostureFoundationPostgresTests — POSTURE-01: migration aditiva sobre regra legada, migrate+seed+
  #     prontidão+idempotência, atualização de metodologia com histórico de proveniência e o índice parcial
  #     único de framework ativa (rejeição da 2ª ativa) no PostgreSQL real.
  # NÃO é a suíte PostgreSQL geral.
  migrations-pg:
    runs-on: ubuntu-latest
    # 20 min (era 15): a jornada HTTP sobe o host da API e prepara o banco pelo migrator real. Mede-se ~4 min
    # localmente para as 41; a folga existe para o runner do CI, não para esconder lentidão.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # AEGIS_TEST_PG aponta para o banco de MANUTENÇÃO (postgres); o PostgresProbe cria/derruba um
      # database descartável a cada teste. Só as classes de migration/postura em PostgreSQL rodam (filtro por
      # classe), incluindo PostureExposurePostgresTests (POSTURE-02), VulnerabilityManagementPostgresTests
      # (AEGIS-MVP-VULN-01: migration multifonte, índice global de CVE, constraints de binding/observação e
      # reconciliação/lifecycle multifonte), DetectionCoveragePostgresTests (AEGIS-MVP-GOOGLE-SECOPS-02:
      # migration da cobertura de detecção, índice único (tenant, conector), substituição atômica e isolamento) e
      # IdentityEvidencePostgresTests (AEGIS-MVP-EVIDENCE-FABRIC-01: migration da Evidence Fabric de identidade,
      # chave natural (tenant, conector), upsert idempotente, preservação degradation-safe, isolamento por tenant
      # e FK COMPOSTA tenant-safe — rejeição de órfão/cross-tenant e cascade na exclusão do conector) e
      # SoftwareInventoryPostgresTests (AEGIS-MVP-MICROSOFT-COVERAGE-01: migration do inventário de software,
      # FKs COMPOSTAS tenant-safe para Asset/Conector/Produto, lifecycle idempotente, preservação dos dados em
      # coleta de falha e ausência de escrita de score) e DevicePosturePostgresTests
