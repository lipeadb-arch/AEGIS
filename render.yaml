# =============================================================================
# AEGIS Score — Blueprint para Render (https://render.com)
#
# UM único Web Service Docker: a API .NET 10 serve o SPA Angular no MESMO domínio.
# O PostgreSQL é EXTERNO (ex.: Neon, com TLS) — NÃO é provisionado aqui.
#
# Este arquivo NÃO contém segredo. Toda variável sensível é declarada com `sync: false`
# (o valor é definido no painel do Render, nunca versionado). Ajuste `plan`/`region`.
# =============================================================================
services:
  - type: web
    name: aegis-score
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    autoDeploy: false
    healthCheckPath: /health/ready

    envVars:
      # ---- Ambiente ----
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_ENVIRONMENT
        value: Production

      # ---- Banco ----
      - key: ConnectionStrings__AegisScore
        sync: false

      # ---- JWT ----
      - key: Jwt__SigningKey
        sync: false

      # ---- Data Protection ----
      - key: DataProtection__Certificate__Path
        value: /etc/secrets/aegis-dataprotection.pfx.b64
      - key: DataProtection__Certificate__Password
        sync: false

      # ---- Bootstrap do primeiro administrador ----
      - key: Bootstrap__Enabled
        value: "false"
      - key: Bootstrap__AdminEmail
        sync: false
      - key: Bootstrap__AdminPassword
        sync: false
      - key: Bootstrap__TenantName
        sync: false
      - key: Bootstrap__TenantSlug
        sync: false

      # ---- IA corporativa (Anthropic Messages API) ----
      # A chave nunca é versionada e continua sendo gate obrigatório. O modo corporativo NÃO remove a
      # allowlist tenant-scoped: somente slugs explicitamente autorizados podem enviar dados ao provedor externo.
      # O uso de dados reais deve respeitar as políticas internas de classificação, necessidade e minimização.
      - key: Ai__Provider
        value: Anthropic
      - key: Ai__Model
        value: claude-opus-4-8
      - key: Ai__BaseUrl
        value: https://api.anthropic.com/v1/messages
      - key: Ai__Mode
        value: ExternalEnterprise
      - key: Ai__ApiKey
        sync: false
      # Nome legado de configuração preservado por compatibilidade; a allowlist também governa ExternalEnterprise.
      - key: Ai__FreeTier__AllowedTenantSlugs__0
        value: aegis-homolog

      # ---- Fila de análise documental ----
      - key: DocumentAnalysisQueue__MaxAttempts
        value: "2"

    # ---- Persistência opcional de uploads ----
    # disk:
    #   name: aegis-document-store
    #   mountPath: /var/aegis-data
    #   sizeGB: 1
    # e DocumentStorage__RootPath=/var/aegis-data/document-store
